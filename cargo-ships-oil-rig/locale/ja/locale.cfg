[entity-description]
oil_rig=沖合原油から大量の原油を採掘するためのリグです。内部電源（無効な場合を除く）と電気ネットワークを持ち、原油リグ自体と接続されたポンプにエネルギーを供給します。
offshore-oil=水底に眠る大規模な原油です。採掘には原油リグが必要です。

[technology-name]
deep_sea_oil_extraction=沖合原油の採掘

[technology-description]
deep_sea_oil_extraction=__ENTITY__offshore-oil__から採掘

[mod-setting-name]
no_shallow_oil=浅瀬に沖合原油が生成されない
no_oil_for_oil_rig=__ENTITY__oil_rig__ の開発に化学サイエンスパックが不要
oil_rig_capacity=__ENTITY__oil_rig__ 容量 x1000
oil_rigs_require_external_power=原油リグ内部電源

[mod-setting-description]
no_oil_for_oil_rig=化学サイエンスパックを原油リグの前提条件としないようにします。陸上の原油がない状態でプレイする場合は有効にしてください。
no_shallow_oil=従来の動作を有効にして、浅瀬に沖合原油が生成されないように妨げます。
oil_rig_capacity=原油リグの内部容量。
oil_rigs_require_external_power=[font=default-bold]小さい:[/font] 原油リグは小さな内部電源を持ち、モジュールの使用時に電気ネットワークで補うことができます(これは通常のモードです)。\n[font=default-bold]なし:[/font] 原油リグは電気ネットワークに接続された時のみ動作します。\n[font=default-bold]無限:[/font] 原油リグは電気ネットワークに接続できなくなくなる代わりに常にフルパワーで動作します。

[string-mod-setting]
oil_rigs_require_external_power-enabled=なし
oil_rigs_require_external_power-only-when-moduled=小さい
oil_rigs_require_external_power-disabled=無限

