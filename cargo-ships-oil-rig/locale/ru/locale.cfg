[entity-description]
oil_rig=Огромная плавающая платформа для добычи глубоководной нефти. Включает собственный генератор энергии и электрическую сеть, снабжающие энергией как саму платформу, так и подлючаемые корабельные насосы.
offshore-oil=Большое месторожение глубоководной нефти. Добывается с помощью нефтяной платформы.

[technology-name]
deep_sea_oil_extraction=Добыча глубоководной нефти

[technology-description]
deep_sea_oil_extraction=Добыча глубоководной нефти.

[mod-setting-name]
no_shallow_oil=Отключить месторождения нефти на мелководье
no_oil_for_oil_rig=Нефтяные платформы могут быть построены до химической науки
oil_rig_capacity=Вместимость нефтяной платформы x1000
oil_rigs_require_external_power=Бесконечный генератор нефтяной платформы

[mod-setting-description]
no_oil_for_oil_rig=Делает технологию, необходимую для строительства глубоководных нефтяных платформ, независимой от химической науки. Нужно включить для возможности игры без наземной нефти.
no_shallow_oil=Включите эту настройку, чтобы предотвратить появление морской нефти на мелководье.
oil_rig_capacity=Внутреннее хранилище нефтяной платформы.
oil_rigs_require_external_power=[font=default-bold]Маленький:[/font] Нефтяные платформи имеют небольшой встроенный генератор, который также можно подпитывать к электросети при использовании модулей (в обычном режиме).\n[font=default-bold]Отсутствует:[/font] Нефтяные платформи работают только при подключении к электросети.\n[font=default-bold]Бесконечный:[/font] Нефтяные платформи не подключаются к электросети и способны работать на полную мощность.

