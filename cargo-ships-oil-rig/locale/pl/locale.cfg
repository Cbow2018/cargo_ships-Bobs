oil_rig_capacity=Wewnętrzna pojemność platform wiertniczych.
oil_rigs_require_external_power=[font=default-bold]Mały:[/font] Platformy mają mały generator, który można wspomóc siecią przy użyciu modułów (To jest standardowy tryb).\n[font=default-bold]Brak:[/font] Platformy działają tylko po podłączeniu do zewnętrznej sieci.\n[font=default-bold]Nieskończony:[/font] Platformy nie łączą się z siecią i zawsze pracują z pełną mocą.

