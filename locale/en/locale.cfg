error-bridge-busy=Error: Make sure no trains and ships are currently crossing before deleting the __ENTITY__bridge_base__.

[tips-and-tricks-item-name]
cargo-ships=Cargo Ships

[tips-and-tricks-item-description]
cargo-ships=Ships are placed on [entity=straight-waterway]. Waterways are obtained by clicking the waterway button in the shortcut bar or by pressing __CONTROL__give-waterway__.\n[item=boat] can be placed on waterways or independently, so that it can be driven like a car.\n\nEach tanker ship can be connected to up to six [entity=ship-loading-pump] or [entity=ship-unloading-pump].
