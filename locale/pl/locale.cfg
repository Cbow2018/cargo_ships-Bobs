[entity-description]
boat=Mała i szybka łódź z niewielką przestrzenią na ekwipunek. Może zostać umieszczona zarówno na drogach wodnych jak i jako niezależny pojazd. Aby wejść lub wyjść wciśnij SHIFT+ENTER.
cargo_ship=Duży statek towarowy zdolny do transportowania ogromnych ilości zasobów. Aby wejść lub wyjść wciśnij SHIFT+ENTER.
oil_tanker=Duży zbiornikowiec zdolny do transportu ogromnych ilości płynów. Aby wejść lub wyjść wciśnij SHIFT+ENTER.
pump=Może być również umieszczona na drogach wodnych w celu załadunku i rozładunku tankowców.
oil_rig=Masywna platforma do wydobywania ropy z głębin morskich. Posiada wbudowany generator i sieć elektryczną, które zasilają samą platformę oraz podłączone do niej pompy
offshore-oil=Duże głębinowe złoże ropy. Możliwość wydobycia za pomocą platformy wiertniczej.
port=Przystanki dla zautomatyzowanych statków.
buoy=Dzieli system dróg wodnych na odstępy blokowe, pozwalając uruchamiać wiele statków w ramach tej samej sieci.
chain_buoy=Odczytuje sygnał kolejnej boi, nie zezwalając na przepłynięcie jeśli również następny odstęp jest zajęty.
bridge_base=Zautomatyzowany most kolejowy, który otwiera się, aby przepuścić statki. Zaleca się stosowanie tej samej sygnalizacji, co przy normalnym przejeździe kolejowym.

