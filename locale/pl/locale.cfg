[entity-description]
boat=Mała i szybka łódź z niewielką przestrzenią na ekwipunek. Może zostać umieszczona zarówno na drogach wodnych jak i jako niezależny pojazd. Aby wejść lub wyjść wciśnij SHIFT+ENTER.
cargo_ship=Duży statek towarowy zdolny do transportowania ogromnych ilości zasobów. Aby wejść lub wyjść wciśnij SHIFT+ENTER.
oil_tanker=Duży zbiornikowiec zdolny do transportu ogromnych ilości płynów. Aby wejść lub wyjść wciśnij SHIFT+ENTER.
pump=Może być również umieszczona na drogach wodnych w celu załadunku i rozładunku tankowców.
port=Przystanki dla zautomatyzowanych statków.
buoy=Dzieli system dróg wodnych na odstępy blokowe, pozwalając uruchamiać wiele statków w ramach tej samej sieci.
chain_buoy=Odczytuje sygnał kolejnej boi, nie zezwalając na przepłynięcie jeśli również następny odstęp jest zajęty.
bridge_base=Zautomatyzowany most kolejowy, który otwiera się, aby przepuścić statki. Zaleca się stosowanie tej samej sygnalizacji, co przy normalnym przejeździe kolejowym.

[item-name]
waterway=Droga wodna

[item-description]
waterway=Droga wodna, po której pływają statki.

[technology-name]
cargo_ships=Statek towarowy
water_transport=Statki
automated_water_transport=Zautomatyzowany transport wodny
tank_ship=Zbiornikowiec
automated_bridges=Mosty kolejowe

[technology-description]
cargo_ships=Transport wodny na dużą skalę.
water_transport=Umożliwia przepływanie zbiorników wodnych.
automated_water_transport=Pozwala na tworzenie dróg wodnych oraz portów do obsługi zautomatyzowanych tras statków.
tank_ship=Umożliwia transport płynów drogą wodną. Zbiornikowce mogą być napełniane i opróżniane przez pompy znajdujące się w portach.
automated_bridges=Pozwala tworzyć mosty, które umożliwiają krzyżowanie się dróg kolejowych i wodnych.

[mod-setting-name]
fuel_modifier=Pojemność paliwa na statku
speed_modifier=Prędkość ruchu statku
waterway_reach_increase=Zwiększ zasięg, trzymając drogi wodne
use_dark_blue_waterways=Ciemniejsze drogi wodne
tanker_capacity=Pojemność zbiornikowca x1000
no_catching_fish=Wyłącz łowienie podajnikami
prevent_waterway_rail_connections=Blokuje łączenie dróg wodnych z innymi rodzajami połączeń

[mod-setting-description]
fuel_modifier=Standardowa pojemność paliwowa statku mnożona jest przez tę wartość. Domyślnie 2.
waterway_reach_increase=Zwiększenie zasięgu graczy podczas trzymania dróg wodnych, boi, portów itp. Pozwala na umieszczanie i dekonstrukcję dróg wodnych z daleka. Ustaw na „0”, aby wyłączyć zwiększanie zasięgu.
use_dark_blue_waterways=Zmienia drogi wodne na ciemniejsze, dzięki czemu są lepiej widoczne. (Obecnie wpływa tylko na stare typy dróg).
speed_modifier=Pomnóż prędkość ruchu statków i łodzi przez tę wartość. Ostrzeżenie: szybkie statki wyglądają dość głupio.
tanker_capacity=Pojemność zbiornikowców.
no_catching_fish=Uniemożliwia łowienie ryb podajnikom umieszczonym przy brzegu wody.
prevent_waterway_rail_connections=Po wybraniu nie będzie można łączyć dróg wodnych z innymi ścieżkami.

[cargo-ship-message]
error-place-on-water=Błąd: __1__ można umieścić tylko na wodzie.
error-connect-rails=Błąd: Nie można połączyć __1__ z __2__.
place-on-waterway=Umieszczanie __1__ na __ITEM__waterway__.
place-independent=Umieszczanie __1__ jako pojazdu sterowalnego.
error-place-on-waterway=Błąd: Nie można umieścić __1__ na __ITEM__waterway__.
error-unlinked-engine=Błąd: Usunięto __1__, ponieważ nie znaleziono powiązanego statku.
error-train-on-waterway=Błąd: __1__ Nie może być umieszczony na __ITEM__waterway__!
error-ship-no-space=Błąd: __1__ musi być umieszczony na __ENTITY__straight-waterway__ z zachowaniem wolnego miejsca z każdej strony!
error-canceled=Błąd: Nie można tu umieścić __1__, przedmiot został zniszczony.
error-bridge-busy=Błąd: Upewnij się, że żadne pociągi ani statki nie przejeżdżają/przepływają przed usunięciem __ENTITY__bridge_base__.

[tips-and-tricks-item-name]
cargo-ships=Statki towarowe

[tips-and-tricks-item-description]
cargo-ships=Statki umieszcza się na [entity=straight-waterway]. Drogi wodne tworzy się klikając przycisk skrótu na pasku lub naciskając __CONTROL__give-waterway__.\n[item=boat] można umieścić na drogach wodnych lub niezależnie, co pozwala sterować nią jak samochodem.\n\nKażdy zbiornikowiec może być obsługiwany przez maksymalnie trzy [entity=pump].

