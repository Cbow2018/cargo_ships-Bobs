[mod-setting-description]
fuel_modifier=Standardowa pojemność paliwowa statku mnożona jest przez tę wartość. Domyślnie 2.
waterway_reach_increase=Zwiększenie zasięgu graczy podczas trzymania dróg wodnych, boi, portów itp. Pozwala na umieszczanie i dekonstrukcję dróg wodnych z daleka. Ustaw na „0”, aby wyłączyć zwiększanie zasięgu.
no_oil_for_oil_rig=Usuwa chemiczne pakiety naukowe jako wymóg dla technologii platform wiertniczych. Włącz, jeśli grasz bez lądowych złóż ropy.
no_shallow_oil=Włącz dla zachowania klasycznego zachowania moda, zapobiegając generowaniu ropy na płytkiej wodzie.
use_dark_blue_waterways=Zmienia drogi wodne na ciemniejsze, dzięki czemu są lepiej widoczne. (Obecnie wpływa tylko na stare typy dróg).
speed_modifier=Pomnóż prędkość ruchu statków i łodzi przez tę wartość. Ostrzeżenie: szybkie statki wyglądają dość głupio.
oil_rig_capacity=Wewnętrzna pojemność platform wiertniczych.
oil_rigs_require_external_power=[font=default-bold]Mały:[/font] Platformy mają mały generator, który można wspomóc siecią przy użyciu modułów (To jest standardowy tryb).\n[font=default-bold]Brak:[/font] Platformy działają tylko po podłączeniu do zewnętrznej sieci.\n[font=default-bold]Nieskończony:[/font] Platformy nie łączą się z siecią i zawsze pracują z pełną mocą.
tanker_capacity=Pojemność zbiornikowców.
no_catching_fish=Uniemożliwia łowienie ryb podajnikom umieszczonym przy brzegu wody.
prevent_waterway_rail_connections=Po wybraniu nie będzie można łączyć dróg wodnych z innymi ścieżkami.

[string-mod-setting]
oil_rigs_require_external_power-enabled=Brak
oil_rigs_require_external_power-only-when-moduled=Mały
oil_rigs_require_external_power-disabled=Nieskończony

[cargo-ship-message]
error-place-on-water=Błąd: __1__ można umieścić tylko na wodzie.
error-connect-rails=Błąd: Nie można połączyć __1__ z __2__.
place-on-waterway=Umieszczanie __1__ na __ITEM__waterway__.
place-independent=Umieszczanie __1__ jako pojazdu sterowalnego.
error-place-on-waterway=Błąd: Nie można umieścić __1__ na __ITEM__waterway__.
error-unlinked-engine=Błąd: Usunięto __1__, ponieważ nie znaleziono powiązanego statku.
error-train-on-waterway=Błąd: __1__ Nie może być umieszczony na __ITEM__waterway__!
error-ship-no-space=Błąd: __1__ musi być umieszczony na __ENTITY__straight-waterway__ z zachowaniem wolnego miejsca z każdej strony!
error-canceled=Błąd: Nie można tu umieścić __1__, przedmiot został zniszczony.
error-bridge-busy=Błąd: Upewnij się, że żadne pociągi ani statki nie przejeżdżają/przepływają przed usunięciem __ENTITY__bridge_base__.

[tips-and-tricks-item-name]
cargo-ships=Statki towarowe

[tips-and-tricks-item-description]
cargo-ships=Statki umieszcza się na [entity=straight-waterway]. Drogi wodne tworzy się klikając przycisk skrótu na pasku lub naciskając __CONTROL__give-waterway__.\n[item=boat] można umieścić na drogach wodnych lub niezależnie, co pozwala sterować nią jak samochodem.\n\nKażdy zbiornikowiec może być obsługiwany przez maksymalnie trzy [entity=pump].


