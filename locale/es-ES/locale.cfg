[entity-description]
boat=Embarcación pequeña y rápida con poco espacio de almacenamiento. Se puede colocar tanto en canales de navegación o de forma independiente.
cargo_ship=Barco grande capaz de transportar una gran cantidad de recursos.
oil_tanker=Barco grande capaz de transportar grandes cantidades de fluidos.
pump=También se puede colocar sobre el agua para cargar y descargar tanques de petróleo.
port=Destinos para barcos automatizados.
buoy=Divide el sistema de canales de navegación en bloques, lo que permite que varios barcos circulen por la misma red.
chain_buoy=Lee las siguientes señales en la ruta que permitiendo un mejor control de los barcos.
bridge_base=Puente para vías automatizado que se abre para permitir el paso de barcos por debajo. Ubíquelo a lo largo de un tramo recto existente del canal de navegación.

