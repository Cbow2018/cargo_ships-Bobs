waterway_reach_increase=Aumentar alcance al construir en aguas profundas
use_dark_blue_waterways=Rutas fluviales más oscuras
tanker_capacity=__ENTITY__oil_tanker__ capacidad x1000
no_catching_fish=Desactivar pesca de insertador
prevent_waterway_rail_connections=Evitar que vías fluviales se conecten con otros tipos de rieles

