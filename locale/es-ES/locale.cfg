[technology-description]
cargo_ships=Transporte a gran escala por agua.
oversea-energy-distribution=Proporciona los medios para conectar las islas a la red eléctrica principal.
water_transport=Proporciona los medios para cruzar masas de agua.
automated_water_transport=Permite crear canal de navegación, que se obtienen utilizando el botón de acceso directo o con __CONTROL__give-waterway__. Se pueden construir puertos en las vías navegables para establecer rutas marítimas automatizadas.
tank_ship=Capacidad para transportar fluidos por agua. Los __ENTITY__oil_tanker__s pueden llenarse y vaciarse mediante bombas.
deep_sea_oil_extraction=__ENTITY__offshore-oil__ extraction
automated_bridges=Permite la construcción de puentes, que permiten que los trenes y las vías fluviales se crucen.

