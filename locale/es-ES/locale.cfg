[tips-and-tricks-item-description]
cargo-ships=Los buques se ubican en [entidad=ruta-fluvial-recta]. Las rutas fluviales se obtienen seleccionando el botón de ruta fluvial en la barra de accesos directos o presionando __CONTROL__give-waterway__. [item=bote] pueden ubicarse tanto dentro de la ruta como fuera, para ser manejado como un auto.


