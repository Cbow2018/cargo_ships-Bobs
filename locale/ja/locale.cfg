[entity-description]
boat=小さな収納スペースを持つ小型で高速なボートです。航路にも、独立した乗り物としても配置可能です。
cargo_ship=膨大な資源を輸送できる大型船です。
oil_tanker=膨大な流体を輸送できる大型船です。
pump=原油タンカーの積み下ろし用に水域に設置することも可能です。
port=自動運行された船の目的地です。
buoy=航路を複数のブロックに分割し、ひとつの航路ネットワークに複数の船が航行できるようにします。
chain_buoy=経路上の次の信号ブイを読み取り、船の制御をより良くします。
bridge_base=その下に船を通すことができる自動化された鉄道可動橋です。正しく機能させるためには、近くに信号ブイや列車用信号を追加で設置しなれければなりません。

[item-name]
waterway=航路

[item-description]
waterway=船が通る水域の経路。

[technology-name]
cargo_ships=__ENTITY__cargo_ship__
water_transport=水運
automated_water_transport=水運の自動化
tank_ship=__ENTITY__oil_tanker__
automated_bridges=鉄道橋

[technology-description]
cargo_ships=水域を利用した大規模な輸送をします。
water_transport=水域を渡る手段を提供します。
automated_water_transport=自動的な航路を設定するための港を建設可能にします。
tank_ship=水域を利用して流体を輸送する能力があります。__ENTITY__oil_tanker__ はポンプで積み下ろしすることができます。
automated_bridges=列車と航路が交差する橋がかけられるようになります。

[mod-setting-name]
fuel_modifier=船の燃料容量
speed_modifier=船の移動速度
waterway_reach_increase=水上設置物を手に持っているときに建築可能範囲を広げる
use_dark_blue_waterways=暗色の航路
tanker_capacity=__ENTITY__oil_tanker__ 容量 x1000
no_catching_fish=インサータによる釣りを無効にする
prevent_waterway_rail_connections=航路が他のレールタイプに接続されるのを防ぐ

[mod-setting-description]
fuel_modifier=船の標準的な燃料容量にこの値を乗じた値です。
waterway_reach_increase=航路、港、ブイなどを手に持っているときにプレイヤーの建築可能範囲が広がり、遠くから航路の建築、分解が可能になります。建築可能範囲の増加を無効にするには 0 に設定します。
use_dark_blue_waterways=航路をより暗い色に変更し、それにより視認性を高めます。(現時点ではレガシーな航路のみに影響します)
speed_modifier=この値で船の移動速度を乗じます。注意: 高速な船は見た目が可笑しいです。
tanker_capacity=タンカーの貯蔵容量。
no_catching_fish=水辺に置かれたインサータが魚を釣るのを止める。
prevent_waterway_rail_connections=選択した場合、航路と他の種類のレールを接続することは出来なくなります。

[cargo-ship-message]
error-place-on-water=エラー: __1__ は水の上にしか置けません。
error-connect-rails=エラー: __1__ を __2__ に繋げません。
place-on-waterway=航路に __1__ を置く。
place-independent=自由に運転できるように __1__ を置く。
error-place-on-waterway=エラー: __1__ を航路に置けません。
error-unlinked-engine=エラー: リンクされた船がない状態で見つかった __1__ を削除します。
error-train-on-waterway=エラー: 航路に __1__ を置けません！
error-ship-no-space=エラー: __1__ は両側に十分な空間を確保された直線航路に置かなれければなりません！
error-canceled=エラー: ここに __1__ を置くことはできません。アイテムは破壊されました。
error-bridge-busy=エラー: __ENTITY__bridge_base__ を削除する前に、現在列車や船が横断していないことを確認してください。

[tips-and-tricks-item-name]
cargo-ships=貨物船

[tips-and-tricks-item-description]
cargo-ships=船たちを [entity=straight-water-way] に配置しましょう。航路はショートカットバーの航路ボタンをクリックするか、 __CONTROL__give-waterway__ を押すことで表示されます。\n[item=boat] は航路にも、車のように運転できる独立した乗り物としても配置可能です。\n\nタンカーは最大3つの [entity=pump] で積み下ろし出来ます。ポンプを手に持つと、有効な設置位置を確認できます。

