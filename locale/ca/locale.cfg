[entity-description]
boat=Una petita i ràpida llanxa amb inventari reduït. Pot col·locar-se en vies navegables o funcionar com a vehicle independent.
cargo_ship=Gran vaixell capaç de transportar grans quantitats de recursos.
oil_tanker=Gran vaixell capaç de transportar grans quantitats de fluids.
pump=També pot col·locar-se a l'aigua per a carregar i descarregar vaixells petroliers.
port=Destinacions per als vaixells amb rutes automàtiques.
buoy=Divideix la via navegable en blocs, cosa que permet que diversos vaixells puguin viatjar per la mateixa xarxa.
chain_buoy=Llegeix i copia el senyal que hi ha a continuació. Permet un millor control del moviment dels vaixells.
bridge_base=Pont ferroviari automatitzat, que s'obre per a deixar passar vaixells per sota. S'ha de col·locar sobre un tram existent de via navegable.

[item-name]
waterway=Via navegable

[item-description]
waterway=Un camí sobre l'aigua que els vaixells poden seguir.

[technology-name]
cargo_ships=Vaixells de càrrega
water_transport=Transport marítim
automated_water_transport=Transport marítim automatitzat
tank_ship=Vaixells petroliers
automated_bridges=Ponts ferroviaris

[technology-description]
cargo_ships=Transport sobre l'aigua a gran escala.
water_transport=Proporciona maneres de creuar masses d'aigua.
automated_water_transport=Permet crear vies navegables, que s'obtenen amb el botó drecera o amb __CONTROL__give-waterway__. Posant ports a les vies navegables es poden crear rutes automatitzades per als vaixells.
tank_ship=Permet transportar fluids a través de l'aigua. Els vaixells petroliers poden omplir-se i buidar-se amb estacions de bombeig.
automated_bridges=Activa els ponts ferroviaris, que permeten que trens i vies navegables es puguin creuar.

[mod-setting-name]
fuel_modifier=Capacitat de combustible del vaixell
speed_modifier=Velocitat de moviment dels vaixells
waterway_reach_increase=Increment de l'abast per a construir a alta mar
use_dark_blue_waterways=Vies navegables fosques
tanker_capacity=Capacitat de __ENTITY__oil_tanker__ ×1000
no_catching_fish=Desactiva la pesca amb inseridors
prevent_waterway_rail_connections=Evita que les vies navegables es puguin connectar amb altres tipus de ferrocarrils

[mod-setting-description]
fuel_modifier=La capacitat estàndard de combustible dels vaixells es veurà multiplicada per aquest valor.
waterway_reach_increase=Incrementa l'abast dels jugadors quan tenen a la mà vies navegables, boies, ports, etc. Permet col·locar i esborrar vies navegables des de lluny. Definiu-ho a 0 per a desactivar l'abast augmentat.
use_dark_blue_waterways=Posa un color més fosc i més visible a les vies navegables. (De moment només afecta les vies navegables antigues)
speed_modifier=Multiplica la velocitat de moviment de vaixells i llanxes per aquest valor. Atenció: Uns vaixells massa ràpids semblaran una pallassada.
tanker_capacity=Capacitat d'emmagatzematge del vaixell petrolier.
no_catching_fish=Impedeix que els inseridors puguin atrapar peixos si es col·loquen a la vora del mar.
prevent_waterway_rail_connections=Si ho activeu no podreu connectar una via navegable amb cap altre tipus de ferrocarril.

[cargo-ship-message]
error-place-on-water=Error: El __1__ només pot col·locar-se dins l'aigua.
error-connect-rails=Error: No es pot connectar __1__ a __2__.
place-on-waterway=Col·locant __1__ sobre una via navegable.
place-independent=Col·locant __1__ com a vehicle independent.
error-place-on-waterway=Error: No s'ha pogut col·locar el __1__ en una via navegable.
error-unlinked-engine=Error: Esborrant __1__ sense un vaixell enllaçat.
error-train-on-waterway=Error: No es pot col·locar __1__ dins de l'aigua!
error-ship-no-space=Error: El __1__ ha de col·locar-se en una via navegable recta i amb prou espai als dos costats!
error-canceled=Error: No es pot col·locar __1__, element destruït.
error-bridge-busy=Error: Abans d'esborrar-ho, assegureu-vos que no hi ha trens ni vaixells fent servir __ENTITY__bridge_base__.

[tips-and-tricks-item-name]
cargo-ships=Vaixells de càrrega

[tips-and-tricks-item-description]
cargo-ships=Els vaixells s'han de col·locar sobre una [entity=straight-waterway]. Les vies navegables es posen amb el botó corresponent de la barra de dreceres o prement __CONTROL__give-waterway__.\nLa [item=boat] pot col·locar-se dins d'una via navegable o com a vehicle independent que es condueix com un cotxe.\n\nCada vaixell petrolier pot omplir-se amb fins a tres [entity=pump]. Amb una estació de bombeig a la mà podreu veure les seves posicions vàlides.

