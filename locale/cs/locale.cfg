place-independent=Umístění __1__ jako volně ovladatelné.
error-place-on-waterway=Chyba: Nelze umístit __1__ na vodní cestu.
error-unlinked-engine=Chyba: Odstranění __1__ nalezeno bez propojené lodi.
error-train-on-waterway=Chyba: __1__ nemůže být umístěn na vodní cestě!
error-ship-no-space=Chyba: __1__ musí být umístěn na přímé vodní cestě s dostatečným prostorem na všechny strany!
error-canceled=Chyba: Nelze umístit __1__ zde, předmět zničen.
error-bridge-busy=Chyba: Před smazáním __ENTITY__bridge_base__ se ujistěte, že žádné vlaky a lodě v současné době neprojíždí.

