[technology-description]
cargo_ships=Storskala transport over vann.
oversea-energy-distribution=Gir mulighet til å koble øyer til hovedstrømnettet.
water_transport=Gir mulighet til å krysse vannområder.
automated_water_transport=Tillater opprettelse av vannveier, som fås via snarveisknappen eller med __CONTROL__give-waterway__. Havner kan bygges på vannveier for å sette opp automatiserte skipsruter.
tank_ship=Mulighet til å transportere væsker over vann. __ENTITY__oil_tanker__s kan fylles og tømmes med pumper.
deep_sea_oil_extraction=__ENTITY__offshore-oil__ utvinning
automated_bridges=Låser opp broer som lar jernbaner og vannveier krysse hverandre.

