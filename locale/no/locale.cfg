[mod-setting-description]
fuel_modifier=Skipenes standard drivstoffkapasitet multipliseres med denne verdien.
waterway_reach_increase=Øker spillerens rekkevidde når vannveier, bøyer, havner osv. holdes. Gjør det mulig å plassere og fjerne vannveier på lang avstand. Sett til '0' for å deaktivere rekkeviddeøkningen.
no_oil_for_oil_rig=Fjerner kravet om kjemisk vitenskap for oljerigger. Aktiver hvis du spiller uten landbaserte oljeforekomster.
no_shallow_oil=Aktiver for eldre oppførsel, som hindrer havolje i grunt vann.
use_dark_blue_waterways=Gjør vannveier mørkere og dermed mer synlige. (Påvirker foreløpig kun eldre vannveier)
speed_modifier=Multipliserer bevegelseshastigheten til skip og båter med denne verdien. Advarsel: Raske skip ser noe komiske ut.
oil_rig_capacity=Intern lagringskapasitet i oljeriggen.
oil_rigs_require_external_power=[font=default-bold]Liten:[/font] Oljerigger har en liten innebygd generator som kan suppleres av strømnettet når moduler brukes (normal modus).\n[font=default-bold]Ingen:[/font] Oljerigger fungerer kun når de er koblet til strømnettet.\n[font=default-bold]Uendelig:[/font] Oljerigger kan ikke kobles til strømnettet og kan alltid kjøre på full effekt.
tanker_capacity=Lagringskapasitet for tankskipet.
no_catching_fish=Hindrer insettere i å fange fisk når de plasseres ved vannkanten.
prevent_waterway_rail_connections=Hvis valgt kan du ikke koble en vannvei til andre jernbanetyper.

[string-mod-setting]
oil_rigs_require_external_power-enabled=Ingen
oil_rigs_require_external_power-only-when-moduled=Liten
oil_rigs_require_external_power-disabled=Uendelig

[cargo-ship-message]
error-place-on-water=Feil: __1__ kan kun plasseres på vann.
error-connect-rails=Feil: Kan ikke koble __1__ til __2__.
place-on-waterway=Plasserer __1__ på vannvei.
place-independent=Plasserer __1__ som fritt kjørbart kjøretøy.
error-place-on-waterway=Feil: Kunne ikke plassere __1__ på vannvei.
error-unlinked-engine=Feil: Sletting av __1__ funnet uten tilknyttet skip.
error-train-on-waterway=Feil: __1__ kan ikke plasseres på vannvei!
error-ship-no-space=Feil: __1__ må plasseres på en rett vannvei med nok plass på alle sider!
error-canceled=Feil: Kan ikke plassere __1__ her, gjenstanden ble ødelagt.
error-bridge-busy=Feil: Sørg for at ingen tog eller skip krysser før __ENTITY__bridge_base__ slettes.

[tips-and-tricks-item-name]
cargo-ships=Lasteskip

[tips-and-tricks-item-description]
cargo-ships=Skip plasseres på [entity=straight-waterway]. Vannveier fås ved å klikke på vannveiknappen i snarveilinjen eller ved å trykke __CONTROL__give-waterway__.\n[item=boat] kan plasseres på vannveier eller uavhengig, slik at den kan kjøres slik som en bil.\n\nHvert tankskip kan lastes med opptil tre [entity=pump]. Hold en pumpe i hånden for å se gyldige plasseringer.


