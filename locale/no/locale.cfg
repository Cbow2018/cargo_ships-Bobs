[entity-description]
boat=Liten og rask båt med begrenset lagringsplass. Kan plasseres enten på vannveier eller som et uavhengig kjøretøy.
cargo_ship=Stort skip som kan transportere store mengder ressurser.
oil_tanker=Stort skip som kan transportere store mengder væsker.
pump=Kan også plasseres på vann for lasting og lossing av tankskip.
oil_rig=Diger flytende utvinningsplattform for havolje. Inkluderer innebygd strømproduksjon (med mindre deaktivert) og elektrisk nettverk som forsyner selve oljeriggen samt tilkoblede pumper med strøm.
offshore-oil=Stor forekomst av dyphavsolje. Utvinnes med oljerigg.
port=Destinasjoner for automatiserte skip.
buoy=Deler vannveisystemet inn i blokker, slik at flere skip kan bruke samme nettverk.
chain_buoy=Leser det neste signalet i ruten for bedre kontroll over skip.
bridge_base=Automatisert jernbanebro som åpner seg slik at skip kan passere under. Plasser langs en eksisterende rett vannvei.

