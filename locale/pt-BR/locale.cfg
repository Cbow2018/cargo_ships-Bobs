[entity-description]
boat=Barco pequeno e rápido com pequeno espaço de inventário. Pode ser colocado em hidrovias ou como veículo independente.
cargo_ship=Grande navio capaz de transportar uma grande quantidade de recursos.
oil_tanker=Grande navio capaz de transportar grande quantidade de fluidos.
pump=Também pode ser colocado na água para carregar e descarregar petroleiros.
oil_rig=Plataforma massiva de extração de petróleo marítimo. Inclui geração de energia a bordo (a menos que desativada) e rede elétrica, abastecendo a própria plataforma de petróleo, bem como as bombas conectadas com energia.
offshore-oil=Grande depósito de petróleo em águas profundas. Extraia com a plataforma de petróleo.
port=Destinos para navios automatizados.
buoy=Divide o sistema hidroviário em blocos, permitindo que vários navios operem na mesma rede.
chain_buoy=Lê os próximos sinais no caminho para permitir melhor controle dos navios.
bridge_base=Ponte ferroviária automatizada, a qual abre para deixar os navios passarem. Posicione ao longo de uma hidrovia reta.

