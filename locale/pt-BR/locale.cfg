[entity-description]
boat=Barco pequeno e rápido com pequeno espaço de inventário. Pode ser colocado em hidrovias ou como veículo independente.
cargo_ship=Grande navio capaz de transportar uma grande quantidade de recursos.
oil_tanker=Grande navio capaz de transportar grande quantidade de fluidos.
pump=Também pode ser colocado na água para carregar e descarregar petroleiros.
port=Destinos para navios automatizados.
buoy=Divide o sistema hidroviário em blocos, permitindo que vários navios operem na mesma rede.
chain_buoy=Lê os próximos sinais no caminho para permitir melhor controle dos navios.
bridge_base=Ponte ferroviária automatizada, a qual abre para deixar os navios passarem. Posicione ao longo de uma hidrovia reta.

[item-name]
waterway=hidrovia

[item-description]
waterway=Caminho sobre a água para os navios seguirem.

[technology-name]
cargo_ships=__ENTITY__cargo_ship__s
water_transport=Transporte hidroviário
automated_water_transport=Transporte hidroviário automatizado
tank_ship=__ENTITY__oil_tanker__s
automated_bridges=Pontes ferroviárias

[technology-description]
cargo_ships=Transporte em larga escala sobre água.
water_transport=Dá meios de atravessar a água.
automated_water_transport=Permite criar hidrovias, as quais podem ser obtidas através do botão de atalho ou com __CONTROL__give-waterway__. Portos podem ser posicionados em hidrovias para configurar rotas de navegação automatizadas.
tank_ship=Habilidade de transportar fluidos sobre a água. O __ENTITY__oil_tanker__ pode ser preenchido e esvaziado utilizando bombas.
automated_bridges=Habilita pontes, que permitem trens e hidrovias cruzarem caminhos.

[mod-setting-name]
fuel_modifier=Capacidade de combustível do navio
speed_modifier=Velocidade de movimento do navio
waterway_reach_increase=Alcance expandido enquanto segura edifícios offshore
use_dark_blue_waterways=Hidrovias mais escuras
tanker_capacity=__ENTITY__oil_tanker__ capacidade x1000
no_catching_fish=Desativar pesca usando insersores
prevent_waterway_rail_connections=Prevenir que hidrovias se conectem a outros tipos de trilhos

[mod-setting-description]
fuel_modifier=Capacidade padrão de combustível dos navios é multiplicada por este valor.
waterway_reach_increase=Expande o alcance de jogadores enquanto seguram hidrovias, boias, portos e etc. Permite posicionar e desmontar hidrovias de longe. Defina como '0' de modo a desativar o alcance estendido.
use_dark_blue_waterways=Altera hidrovias para serem mais escuras e visíveis. (Atualmente só faz efeito em hidrovias legadas)
speed_modifier=Multiplica a velocidade de navios e barcos com este valor. Atenção: Navios rápidos parecem bobos.
tanker_capacity=Capacidade de armazenamento do navio petroleiro.
no_catching_fish=Previne que insersores coletem peixes se posicionados na borda da água.
prevent_waterway_rail_connections=Se selecionado, você não poderá conectar uma hidrovia com outro tipo de trilho.

[cargo-ship-message]
error-place-on-water=Erro: __1__ pode ser posicionado apenas na água.
error-connect-rails=Erro: Não é possível conectar __1__ a __2__.
place-on-waterway=Posicionando __1__ em uma hidrovia.
place-independent=Posicionando __1__ com condução liberada.
error-place-on-waterway=Erro: Não é possível colocar __1__ na hidrovia.
error-unlinked-engine=Erro: Excluir __1__ encontrado sem um navio vinculado.
error-train-on-waterway=Erro: __1__ não pode ser posicionado na hidrovia!
error-ship-no-space=Erro: __1__ precisa ser posicionado em uma hidrovia reta com espaço suficiente de todos os lados!
error-canceled=Erro: Não é possível posicionar __1__ aqui, item destruído.
error-bridge-busy=Erro: Tenha certeza que não há trens e barcos cruzando antes de remover __ENTITY__bridge_base__.

[tips-and-tricks-item-name]
cargo-ships=Navios cargueiros

[tips-and-tricks-item-description]
cargo-ships=Ships are placed on [entity=straight-water-way]. Waterways are obtained by clicking the waterway button in the shortcut bar or by pressing __CONTROL__give-waterway__.\n[item=boat] can be placed on waterways or independently, so that it can be driven like a car.\n\nEach tanker ship can be loaded with up to three [entity=pump]. Hold a pump in hand to see the valid placement positions.

