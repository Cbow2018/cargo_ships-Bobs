floating_pole_enabled=Habilitar __ENTITY__floating-electric-pole__
floating_pole_fulgora=Habilitar __ENTITY__floating-electric-pole__ em __TILE__oil-ocean-shallow__
floating_pole_aquilo=Habilitar __ENTITY__floating-electric-pole__ em __TILE__ammoniacal-ocean__
offshore_oil_enabled=Habilitar __ENTITY__offshore-oil__ e __ENTITY__oil_rig__
fuel_modifier=Capacidade de combustível do navio
speed_modifier=Velocidade de movimento do navio
no_shallow_oil=No offshore oil in shallow water
waterway_reach_increase=Alcance expandido enquanto segura edifícios offshore
no_oil_for_oil_rig=__ENTITY__oil_rig__ sem pacote científico de química
use_dark_blue_waterways=Hidrovias mais escuras
oil_rig_capacity=__ENTITY__oil_rig__ capacidade x1000
oil_rigs_require_external_power=Gerador a bordo da plataforma de petróleo
tanker_capacity=__ENTITY__oil_tanker__ capacidade x1000
no_catching_fish=Desativar pesca usando insersores
prevent_waterway_rail_connections=Prevenir que hidrovias se conectem a outros tipos de trilhos

[mod-setting-description]
fuel_modifier=Capacidade padrão de combustível dos navios é multiplicada por este valor.
waterway_reach_increase=Expande o alcance de jogadores enquanto seguram hidrovias, boias, portos e etc. Permite posicionar e desmontar hidrovias de longe. Defina como '0' de modo a desativar o alcance estendido.
no_oil_for_oil_rig=Remove o pre-requisito do pacote científico de química para desbloquear plataformas de petróleo. Habilite se estiver jogando sem poços de petróleo disponíveis em terra.
no_shallow_oil=Habilite para o comportamento legado, de modo a prevenir petróleo offshore em águas rasas.
use_dark_blue_waterways=Altera hidrovias para serem mais escuras e visíveis. (Atualmente só faz efeito em hidrovias legadas)
speed_modifier=Multiplica a velocidade de navios e barcos com este valor. Atenção: Navios rápidos parecem bobos.
oil_rig_capacity=Armazenamento interno da plataforma de petróleo.
oil_rigs_require_external_power=[font=default-bold]Pequeno:[/font] Plataformas de petróleo possuem um pequeno gerador de bordo que pode ser complementado pela rede elétrica ao utilizar módulos (este é o modo normal)\n[font=default-bold]Nenhum:[/font] Plataformas de petróleo só funcionarão quando conectadas a uma rede elétrica.\n[font=default-bold]Infinito:[/font] Plataformas de petróleo não podem ser conectadas a redes elétricas e irão sempre funcionar na capacidade máxima.
tanker_capacity=Capacidade de armazenamento do navio petroleiro.
no_catching_fish=Previne que insersores coletem peixes se posicionados na borda da água.
prevent_waterway_rail_connections=Se selecionado, você não poderá conectar uma hidrovia com outro tipo de trilho.

[string-mod-setting]
oil_rigs_require_external_power-enabled=Nenhum
oil_rigs_require_external_power-only-when-moduled=Pequeno
oil_rigs_require_external_power-disabled=Infinito

