[entity-description]
boat=Невеликий і швидкий човен з невеликим інвентарним простором. Може використовуватися як на водних шляхах, так і як самостійний транспортний засіб.
cargo_ship=Великий корабель, здатний перевозити величезну кількість ресурсів.
oil_tanker=Великий корабель, здатний перевозити величезну кількість рідин.
pump=Може також розміщуватися на воді для завантаження і розвантаження нафтових танкерів.
port=Пункти призначення для автоматизованих кораблів.
buoy=Розділяє систему водних шляхів на блоки, дозволяючи декільком суднам ходити одною мережею.
chain_buoy=Зчитує наступні сигнали на шляху, щоб краще контролювати судна.
bridge_base=Автоматизований залізничний міст, що відкривається для проходження суден. Розміщується вздовж наявної прямої ділянки водного шляху.

[item-name]
waterway=Водний шлях

[item-description]
waterway=Шлях над водою для кораблів.

[technology-name]
cargo_ships=__ENTITY__cargo_ship__с
water_transport=Водний транспорт
automated_water_transport=Автоматизований водний транспорт
tank_ship=__ENTITY__oil_tanker__с
automated_bridges=Залізничні мости

[technology-description]
cargo_ships=Масштабні перевезення по воді.
water_transport=Дає можливість переправлятися через водойми.
automated_water_transport=Дозволяє створювати водні шляхи, які отримуються за допомогою кнопки швидкого доступу або за допомогою __CONTROL__give-waterway__. На водних шляхах можна будувати порти для створення автоматизованих маршрутів кораблів.
tank_ship=Здатність транспортувати рідини по воді. Нафтові танкери __ENTITY__oil_tanker__ можуть наповнюватися і спорожнятися за допомогою помп.
automated_bridges=Вмикає мости, які дозволяють поїздам і водним шляхам перетинати шляхи.

[mod-setting-name]
fuel_modifier=Паливна місткість судна
speed_modifier=Швидкість руху корабля
waterway_reach_increase=Збільшення охоплення при утриманні будівель
use_dark_blue_waterways=Темні водні шляхи
tanker_capacity=__ENTITY__oil_tanker__ потужність x1000
no_catching_fish=Вимкнути ловлю маніпуляторами
prevent_waterway_rail_connections=Запобігання з'єднанню водних шляхів з іншими типами залізниць

[mod-setting-description]
fuel_modifier=На це значення множиться стандартна паливна місткість судна.
waterway_reach_increase=Збільшення досяжності гравців при утриманні водних шляхів, буїв, портів тощо. Дозволяє встановлювати та руйнувати водні шляхи з великої відстані. Встановіть значення "0", щоб вимкнути збільшення досяжності.
use_dark_blue_waterways=Робить водні шляхи темнішими й, таким чином, більш помітними. (Наразі впливає лише на застарілі водні шляхи)
speed_modifier=Помножте швидкість руху кораблів і човнів на це значення. Увага: Швидкі кораблі виглядають безглуздо.
tanker_capacity=Місткість танкера.
no_catching_fish=Перешкоджає маніпуляторам ловити рибу, якщо вони розміщені біля ребра води.
prevent_waterway_rail_connections=Якщо вибрано, ви не зможете з'єднати водний шлях з іншим типом залізниці.

[cargo-ship-message]
error-place-on-water=Помилка: __1__ можна ставити тільки на воду.
error-connect-rails=Помилка: Не вдається з'єднати __1__ з __2__.
place-on-waterway=Розміщення __1__ на водному шляху.
place-independent=Розміщення __1__ у вільному доступі.
error-place-on-waterway=Помилка: Не вдалося розмістити __1__ на водному шляху.
error-unlinked-engine=Помилка: Видалення __1__, знайденого без прив'язаного корабля.
error-train-on-waterway=Помилка: __1__ не може бути розміщений на водному шляху!
error-ship-no-space=Помилка: __1__ повинен бути розміщений на прямому водному шляху з достатнім простором з усіх боків!
error-canceled=Помилка: Неможливо розмістити __1__ тут, елемент знищено.
error-bridge-busy=Помилка: Перед видаленням __ENTITY__bridge_base__ переконайтеся, що через нього не проходять поїзди та кораблі.

[tips-and-tricks-item-name]
cargo-ships=Вантажні кораблі

[tips-and-tricks-item-description]
cargo-ships=Кораблі розміщуються на [entity=straight-waterway]. Водні шляхи можна отримати, натиснувши кнопку водного шляху на панелі швидкого доступу або натиснувши __CONTROL__give-waterway__.\n[item=boat] можна розмістити на водних шляхах або незалежно, щоб ним можна було керувати, як автомобілем.\n\nКожен танкер може бути завантажений до трьох [entity=pump]. Потримайте помпу у руці, щоб побачити допустимі позиції розміщення.

